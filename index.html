<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>花間英文手帳｜國二英文</title><style>
:root{font-size:18px;color:#443d54;background:#faf6f4;font-family:system-ui,"Microsoft JhengHei",sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% 20%,#ecd1db99,transparent 45%),radial-gradient(ellipse at 90% 45%,#cbdedc88,transparent 40%),radial-gradient(ellipse at 45% 90%,#d7cbe688,transparent 40%);min-height:100vh}header,main,footer{max-width:1160px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:1px solid #d9ccd5}.brand{font-family:serif;font-size:1.3rem}.tools,.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}button,a{font:inherit;-webkit-tap-highlight-color:transparent}button,.link{border:1px solid #bda7bd;background:#fff9;color:#51425f;border-radius:12px;padding:11px 16px;cursor:pointer;text-decoration:none;display:inline-block;min-height:44px}button:hover,.link:hover{background:#eadce8}button:focus-visible,a:focus-visible{outline:3px solid #82557c;outline-offset:3px}button[aria-pressed=true],.primary{background:#76566f;color:white;border-color:#76566f}.eyebrow{letter-spacing:.16em;font-size:.76rem;color:#76637b}h1,h2,h3{font-family:Georgia,"Noto Serif TC",serif;font-weight:500}h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1.35;margin:15px 0}h2{font-size:1.5rem}p{line-height:1.85}.intro{padding:24px 0 20px;display:grid;grid-template-columns:2fr 1fr;gap:30px;align-items:center}.note{border-left:3px solid #ba92ac;padding:12px 20px;background:#ffffff70}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:24px 0}.card{padding:26px;background:#ffffffaa;border:1px solid #fff;border-radius:6px 40px 6px 6px;box-shadow:0 12px 35px #55405b0b;display:flex;flex-direction:column;position:relative}.card:nth-child(2){background:#edf6f2bd}.card:nth-child(3){background:#f0ebf8c9}.num{font:italic 2.8rem Georgia;color:#98718a}.card h2{margin:12px 0}.card p{flex:1}.card .link{margin-top:10px;text-align:center}.small{font-size:.82rem;color:#6b6072}.panel{background:#fff9;border:1px solid #e4d9e4;border-radius:24px;padding:26px;margin-top:24px}.quizgrid{display:grid;grid-template-columns:1fr 1.6fr;gap:30px}.choices{display:grid;gap:10px}.choices button{text-align:left}.feedback{min-height:4.5em;padding:14px;background:#f2edf4;border-radius:12px;line-height:1.7}.feedback.good{background:#e1efe7;color:#275744}progress{width:100%;accent-color:#87647f;height:12px}.levels{display:flex;gap:10px;flex-wrap:wrap}.chips{line-height:1.8;color:#72576d}.card:hover{box-shadow:0 15px 36px #55405b15}footer{text-align:center;font-size:.8rem;color:#726577}@media(max-width:740px){header,main{padding:18px}.cards,.intro,.quizgrid{grid-template-columns:1fr}.intro{gap:6px}.card{padding:22px}.tools button{font-size:.85rem}.panel{padding:20px}}@media(prefers-reduced-motion:no-preference){button,.card,.link{transition:background .2s,box-shadow .2s}}
.intro{border-bottom:1px solid #dfccd8;padding-bottom:28px}.cards{grid-template-columns:1fr}.card{display:grid;grid-template-columns:72px 1fr auto;gap:6px 20px;border-radius:8px 28px 28px 8px;border-left:5px solid #c8a0b8}.card .num{grid-row:1/4;align-self:center}.card .small,.card h2,.card p{grid-column:2;margin:3px 0}.card .link{grid-column:3;grid-row:1/3;align-self:center}.card .link:last-child{grid-row:3;font-size:.85rem}.card:nth-child(2){border-left-color:#98bcb4}.card:nth-child(3){border-left-color:#aca0c6}.intro h1{font-size:clamp(2rem,5vw,3.3rem)}@media(max-width:640px){.card{grid-template-columns:44px 1fr;padding:20px;gap:6px 12px}.card .num{font-size:2rem}.card .link,.card .link:last-child{grid-column:1/-1;grid-row:auto}.quizgrid{gap:16px}}</style><header><div class="brand">✧ 花間英文手帳</div><div class="tools"><button id="down" aria-label="縮小字體">A−</button><button id="up" aria-label="放大字體">A＋</button><button id="sfx" aria-pressed="false">音效：關</button><button id="music" aria-pressed="false">♫ 音樂：關</button><button id="read">朗讀／停止</button></div></header><main><section class="intro"><div><div class="eyebrow">ENGLISH JOURNAL · GRADE 8</div><h1>把日常，<br>寫成自己的英文。</h1><p>從一段旅行、一場社團活動，到昨天的片刻。<br>選一站，留下今天的小小發現。</p></div><aside class="note"><b>今天，照自己的步調。</b><p>不用計時，也沒有排名。<br>先猜、看線索、再試一次。</p><div id="total" class="chips" aria-live="polite"></div><div id="storageNote" class="small">紀錄保存在目前瀏覽器。</div></aside></section><section aria-label="三個英文課程"><div class="row"><h2>三封邀請，選一封打開</h2><button id="pick">幫我選一站 ↗</button></div><p id="pickFb" aria-live="polite" class="small">三課都可以自由進入。</p><div class="cards" id="cards"></div></section><section class="panel"><div class="quizgrid"><div><div class="eyebrow">A LITTLE WARM-UP</div><h2>一封小任務，練習說得更清楚。</h2><p>每階三題，橫跨三個單元。<br>答錯有提示，答對留下理解印章。</p><div class="levels" id="levels"><button data-l="0" aria-pressed="true">易・採集</button><button data-l="1" aria-pressed="false">中・連結</button><button data-l="2" aria-pressed="false">難・推理</button></div><p id="badges" class="chips"></p></div><div><p class="small" id="qmeta"></p><h3 id="question"></h3><div id="choices" class="choices"></div><p id="fb" class="feedback" aria-live="polite">選一個答案，看看你的想法。</p><div class="row"><button id="hint">給我線索</button><button id="next">下一張 →</button><a id="deep" class="link primary">到本課挑戰 ↗</a></div></div></div></section></main><footer>花間英文手帳 · 你不必一次懂全部，每次多懂一點就好。<br>音樂與音效預設關閉；背景旋律為原創合成音。</footer><script>
(()=>{'use strict';const el=id=>document.getElementById(id),names=['晴信旅行','社團手帳','暮色時光'],desc=['談天氣、換個方式送出禮物，寫一張旅行明信片。','探索社團、使用所有格代名詞，讓 before 與 after 排好事件順序。','辨認家務單字與時間，用 was / were＋V-ing 描述昨天正在發生的事。'],keys=[];let record={done:[]},lv=0,qi=0,font=18,sound=false,ctx,timer;function get(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}record=get('english-hub-v1')||record;if(!Array.isArray(record.done))record.done=[];function save(){try{localStorage.setItem('english-hub-v1',JSON.stringify(record))}catch(e){el('storageNote').textContent='目前無法儲存紀錄，仍可繼續練習。'}}function stats(){el('total').textContent='首頁理解印章 '+record.done.length+' / 9';el('badges').textContent=[0,1,2].map(l=>record.done.filter(x=>x.startsWith(l+'-')).length===3?['✧ 觀念採集家','✧ 證據連結家','✧ 語境推理家'][l]:'').filter(Boolean).join(' ｜ ')}
el('cards').innerHTML=names.map((n,i)=>`<article class="card"><div class="num">0${i+1}</div><div class="small">UNIT ${i+1} · ${['WEATHER & TRAVEL','CLUBS & STORIES','MOMENTS & TIME'][i]}</div><h2>${n}</h2><p>${desc[i]}</p><a class="link primary" href="E${i+1}.html">打開本課 ↗</a><a class="link" href="E${i+1}.html?level=0">直接到三階挑戰</a></article>`).join('');el('pick').onclick=()=>{const i=Math.floor(Math.random()*3);el('pickFb').replaceChildren(document.createTextNode('今天可以試試：'+names[i]+'。 '));const a=document.createElement('a');a.href='E'+(i+1)+'.html';a.textContent='出發 ↗';el('pickFb').append(a)};
const bank=[[["It was ___ yesterday. The sky was full of clouds.", ["cloudy", "sunny", "snowy"], 0, "cloudy 指多雲的；clouds 是句中的線索。", "Look at the word clouds."], ["This notebook belongs to me. It is ___.", ["mine", "my", "me"], 0, "空格後沒有名詞，用所有格代名詞 mine。", "My needs a noun after it; mine can stand alone."], ["At eight last night, I ___ reading.", ["was", "were", "am"], 0, "過去某時正在做：I was＋V-ing。", "I goes with was in the past."]], [["Mia gave a postcard ___ her friend.", ["to", "for", "at"], 0, "give＋物品＋to＋人；句中 gave 是 give 的過去式。", "Think: give something to someone."], ["I finished my homework. Then I called Jo. I called Jo ___ I finished my homework.", ["after", "before", "whose"], 0, "先完成作業，再打電話；after 後面接先發生的事。", "Which event happened first?"], ["A quarter to eight means ___.", ["7:45", "8:15", "8:45"], 0, "to 指距離下一個整點還有幾分；差一刻八點是 7:45。", "A quarter is fifteen minutes."]], [["Choose the correct sentence about a gift.", ["Leo bought a notebook for Amy.", "Leo bought Amy for a notebook.", "Leo bought a notebook to Amy."], 0, "buy＋物品＋for＋人，表示為某人購買物品。", "Buy something for someone."], ["Before Eva joined the club, she read its poster. What happened first?", ["She read the poster.", "She joined the club.", "Both happened at the same time."], 0, "before 子句中的 joined 較晚；讀海報較早。", "The event after before happens later."], ["The phone rang while we were drawing. Which action was already in progress?", ["We were drawing.", "The phone rang.", "Neither action."], 0, "were drawing 表示當時正在進行；rang 是插入的事件。", "Look for was or were plus an -ing verb."]]];
function render(){const q=bank[lv][qi];el('qmeta').textContent=['易・採集','中・連結','難・推理'][lv]+' · '+(qi+1)+' / 3 · '+names[qi];el('question').textContent=q[0];el('fb').className='feedback';el('fb').textContent='選一個答案，看看你的想法。';el('deep').href='E'+(qi+1)+'.html?level='+lv;el('choices').replaceChildren();const order=[0,1,2];for(let i=2;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}order.forEach(i=>{const b=document.createElement('button');b.textContent=q[1][i];b.onclick=()=>{const ok=i===q[2];el('fb').textContent=ok?'理解 +1 ✧ '+q[3]:'再想一想：'+q[4];el('fb').className='feedback'+(ok?' good':'');if(sound)tone(ok?660:330,.18,.025);if(ok){let key=lv+'-'+qi;if(!record.done.includes(key)){record.done.push(key);save();stats()}el('choices').querySelectorAll('button').forEach(x=>x.disabled=true)}};el('choices').append(b)});}
el('levels').querySelectorAll('button').forEach(b=>b.onclick=()=>{lv=+b.dataset.l;qi=0;el('levels').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});el('hint').onclick=()=>el('fb').textContent=bank[lv][qi][4];el('next').onclick=()=>{qi=(qi+1)%3;render()};el('down').onclick=()=>document.documentElement.style.fontSize=(font=Math.max(16,font-2))+'px';el('up').onclick=()=>document.documentElement.style.fontSize=(font=Math.min(28,font+2))+'px';function tone(f,d=1,v=.012){try{ctx??=new(window.AudioContext||window.webkitAudioContext)();ctx.resume();const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;g.gain.setValueAtTime(0,ctx.currentTime);g.gain.linearRampToValueAtTime(v,ctx.currentTime+.03);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+d);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+d)}catch(e){el('fb').textContent='此裝置暫不支援音訊。'}}el('sfx').onclick=()=>{sound=!sound;el('sfx').textContent='音效：'+(sound?'開':'關');el('sfx').setAttribute('aria-pressed',sound)};function stop(){clearInterval(timer);timer=null;el('music').textContent='♫ 音樂：關';el('music').setAttribute('aria-pressed','false');if(ctx)ctx.suspend()}el('music').onclick=()=>{if(timer){stop();return}let i=0,notes=[261.63,329.63,392,440,392,329.63,293.66,329.63];tone(notes[i++]);timer=setInterval(()=>tone(notes[i++%8]),1500);el('music').textContent='♫ 音樂：開';el('music').setAttribute('aria-pressed','true')};el('read').onclick=()=>{if(!window.speechSynthesis){el('fb').textContent='此瀏覽器不支援朗讀，請閱讀題卡。';return}if(speechSynthesis.speaking){speechSynthesis.cancel();return}stop();const u=new SpeechSynthesisUtterance(bank[lv][qi][0]+'。'+bank[lv][qi][1].join('。'));u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)};document.addEventListener('visibilitychange',()=>{if(document.hidden){stop();window.speechSynthesis?.cancel()}});stats();render();})();
</script></html>
