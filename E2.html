const GAS_URL = 'https://script.google.com/macros/s/AKfycbw3Azzqw1d0ioBGp0EmuVUqYGxhL7Mrke0q1OiSPogB3KKfJ3dRYuLDETa4dtVi9ijc/exec';
const KEY='club-journal-l2-v1';
const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}let state={done:saved.done||[],draft:saved.draft||{},size:saved.size||18};let page=0,level=0,qi=0,chosen=[],audioOn=false,ctx,timer,attachment=null,readingFile=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){$('toast').textContent='此瀏覽器無法儲存進度，請下載作品備份。'}}
function award(id){if(!state.done.includes(id)){state.done.push(id);save();tone();}score()}
function score(){$('score').textContent=`已收集 ${state.done.length} / 30 枚花瓣`;$('progress').value=state.done.length;$('badges').innerHTML=['萌芽','探索','綻放'].map((x,i)=>`<span class="badge ${state.done.length>=[1,12,24][i]?'earned':''}">${x}</span>`).join('')}
function context(){ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume();return ctx}
function note(freq,dur=.25,vol=.035){let c=context(),o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(0,c.currentTime);g.gain.linearRampToValueAtTime(vol,c.currentTime+.03);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+dur);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+dur)}
function tone(){if(audioOn){note(523);setTimeout(()=>note(659),120)}}
function speak(t){if(!('speechSynthesis'in window)){$('toast').textContent='這個瀏覽器不支援朗讀。';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.82;speechSynthesis.speak(u)}
$('stop').onclick=()=>window.speechSynthesis?.cancel();$('sound').onclick=()=>{audioOn=!audioOn;$('sound').textContent='音效 '+(audioOn?'開':'關');$('sound').setAttribute('aria-pressed',audioOn)};
$('music').onclick=()=>{if(timer){clearInterval(timer);timer=null}else{let n=0,notes=[261.63,329.63,392,329.63,293.66,349.23,440,349.23];note(notes[n++],1.5,.018);timer=setInterval(()=>note(notes[n++%notes.length],1.5,.018),900)}$('music').textContent='♫ 配樂 '+(timer?'開':'關');$('music').setAttribute('aria-pressed',!!timer)};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&timer)$('music').click()});
function resize(n){state.size=Math.max(16,Math.min(28,state.size+n));document.documentElement.style.fontSize=state.size+'px';save()}$('smaller').onclick=()=>resize(-2);$('larger').onclick=()=>resize(2);resize(0);
const pages=['01 社團圖鑑','02 任務練習','03 句子拼貼','04 閱讀工作室','05 我的作品'];
function go(n){page=n;window.speechSynthesis?.cancel();$('nav').innerHTML=pages.map((p,i)=>`<button aria-pressed="${i===n}" onclick="go(${i})">${p}</button>`).join('');[vocab,quiz,sorter,reading,studio][n]();score()}
function shell(k,title,body){$('app').innerHTML=`<div class="paper"><div class="kicker">${k}</div><h1>${title}</h1>${body}<footer>依提供的 iE3 二上 Unit 2 學習目標編製；本網站例句、閱讀短文與題目為原創。Review 1 不列入本課。</footer></div>`}
const words=[['science','科學','Explore questions about the world.'],['math','數學','Find patterns in numbers.'],['magic','魔術','Enjoy a surprising show.'],['soccer','足球','Practice with your team.'],['Chinese history','中國歷史','Learn about people from the past.'],['violin','小提琴','Make music with friends.'],['robot design','機器人設計','Build a robot that can move.'],['health and PE','健康與體育','Learn healthy habits and play sports.'],['sign up','報名','I want to sign up today.'],['skill','技能','Drawing is a useful skill.'],['choice','選擇','You can make your own choice.'],['information','資訊','Read the information on the poster.']];
function vocab(){shell('Discover / 翻開一頁','找到想探索的社團',`<p>點卡片翻看中文與例句，再聽聽英文。你不必已經很擅長，才開始學習。</p><div class="grid">${words.map((w,i)=>`<div><button class="flash" id="w${i}" onclick="flip(${i})"><span class="kicker">${String(i+1).padStart(2,'0')}</span><strong>${w[0]}</strong><span class="muted">點一下翻卡</span></button><button class="small" onclick="speak(words[${i}][0])">▶ 聽單字</button></div>`).join('')}</div><details style="margin-top:1rem"><summary>隨身文法筆記</summary><p><b>after + 先發生的事</b>；<b>before + 後發生的事</b>；when 表示「當……時」。時間子句放句首，後面加逗號。</p><p>After I finished my drawing, I called Mia.<br>I called Mia before I went to bed.</p><table><tr><th>所有格＋名詞</th><th>代名詞（不再接名詞）</th></tr>${[['my','mine'],['your','yours'],['his','his'],['her','hers'],['our','ours'],['their','theirs']].map(x=>`<tr><td>${x[0]} notebook</td><td>${x[1]}</td></tr>`).join('')}</table><p>Whose notebook is this? → It is hers.</p></details>`)}
function flip(i){let w=words[i],b=$('w'+i);let on=b.dataset.on==='1';b.dataset.on=on?'0':'1';b.innerHTML=`<strong>${w[0]}</strong><span>${on?'點一下翻卡':w[1]}</span>${on?'':`<span class="small">${w[2]}</span>`}`}
const Q=[
[['想研究數字規律，選哪個社團？',['the math club','the violin club','the soccer club'],0,'math 是數學；留意 numbers 這個線索。'],['打電話先介紹自己：___ Nora speaking.',['This is','That has','Here are'],0,'電話介紹自己常用 This is + 名字。'],['你要找 Leo，哪句較合適？',['May I speak to Leo, please?','Who are your Leo?','Where Leo speak?'],0,'May I speak to…? 是禮貌的電話用語。'],['這是我的筆：This pen is ___.',['mine','my','me'],0,'空格後沒有名詞，用 mine。'],['想知道背包主人：___ bag is this?',['Whose','Who','When'],0,'Whose 問「誰的」；when 問時間。'],['聽一聽，再選社團。',['the violin club','the math club','the soccer club'],0,'聽到 music 和 violin，可以推測社團。','We play the violin and share our music on Fridays.'],['朋友暫時不在，你想晚點回電。',['I will call back later.','I will write on the wall.','I am your number.'],0,'call back 表示回電。'],['她的海報：The poster is ___.',['hers','her','she'],0,'hers 已包含「她的東西」，不再接名詞。']],
[['先畫圖，再吃飯：I drew a picture ___ I ate lunch.',['before','after','whose'],0,'draw 在前，eat 在後，before 後面接後發生的事件。'],['先練琴，再打電話：___ I practiced, I called Ava.',['After','Before','Whose'],0,'After 後接先發生的練習。'],['當門鈴響時，我開門：___ the bell rang, I opened the door.',['When','Whose','Mine'],0,'When 用來引出「當門鈴響時」的時間。'],['我們的球拍：These rackets are ___.',['ours','our','us'],0,'ours 是所有格代名詞。'],['哪個句子正確？',['Before I left, I packed my bag.','Before I left I, packed my bag.','Before, I left I packed my bag.'],0,'時間子句在句首，整個子句後加逗號。'],['聽一聽：什麼事先發生？',['She read the poster.','She called her friend.','She joined a concert.'],0,'after 後面描述較早發生的事。','Mia called her friend after she read the club poster.'],['對方要找的人就是你，你可以說：',['Speaking.','Wrong music.','Mine is.'],0,'Speaking. 表示「我就是」。'],['這是他們的作品：The artwork is ___.',['theirs','their','them'],0,'theirs = their artwork。']],
[['哪句等於「先練習，再表演」？',['We performed after we practiced.','We practiced after we performed.','We performed before we practiced.'],0,'After we practiced 指練習完成之後。'],['修正：This notebook is her.',['This notebook is hers.','This notebook is she.','This notebook is hers notebook.'],0,'be 動詞後表示「她的東西」，用 hers。'],['Before Jo called Kim, Jo read the ad. 哪件事在後？',['Jo called Kim.','Jo read the ad.','兩件事的先後無法判斷。'],0,'before 子句的 called 在後，read 在前。'],['Which sentence has the same meaning as “I ate before I studied”?',['After I ate, I studied.','Before I ate, I studied.','I ate after I studied.'],0,'不只替換連接詞，還要保留事件順序。'],['聽訊息：你应该怎麼做？',['Call again after four.','Call before two.','Visit at three.'],0,'抓住 after four；不要只聽到數字就作答。','Lily is at her club now. Please call again after four.'],['The camera is his. 哪個解釋正確？',['his 可以獨立表示他的相機。','his 後面一定要有名詞。','his 只能指女生的東西。'],0,'his 的所有格與所有格代名詞同形。'],['比較兩句：① My poster is blue. ② Mine is blue.',['兩句皆可，②需從上下文知道 mine 指什麼。','只有①正確。','只有②正確。'],0,'代名詞用來避免重複已知名詞。'],['哪句符合「電話中請對方稍候」？',['Please hold on for a moment.','Please own this moment.','Please whose moment.'],0,'hold on 在電話情境表示稍候。']]];
function levels(){return `<div class="row level">${['易 · 萌芽','中 · 探索','難 · 綻放'].map((x,i)=>`<button aria-pressed="${i===level}" onclick="level=${i};qi=0;quiz()">${x}</button>`).join('')}</div>`}
function quiz(){let q=Q[level][qi];let opts=q[1].map((t,i)=>({t,i})).sort(()=>Math.random()-.5);shell('Practice / 每次前進一點','社團任務信封',levels()+`<p class="muted">第 ${qi+1} / 8 題 · 此關已完成 ${Q[level].filter((_,i)=>state.done.includes('q'+level+'-'+i)).length} 題</p><h2>${esc(q[0])}</h2>${q[4]?`<button onclick="speak(Q[level][qi][4])">▶ 播放聽力</button><details><summary>需要文字支援</summary><p>${q[4]}</p></details>`:''}<div class="options">${opts.map(o=>`<button onclick="answer(${o.i},this)">${esc(o.t)}</button>`).join('')}</div><div id="feedback" class="feedback" role="status">選一個答案；答錯可以再試。</div><div class="row"><button onclick="hint()">給我線索</button><button onclick="qi=(qi+7)%8;quiz()">上一題</button><button class="primary" onclick="qi=(qi+1)%8;quiz()">下一題</button></div>`)}
function hint(){$('feedback').textContent=Q[level][qi][3]}
function answer(i,b){let q=Q[level][qi],ok=i===q[2];$('feedback').className='feedback '+(ok?'good':'');$('feedback').textContent=(ok?'答對了！ ':'再想一想：')+q[3];if(ok){award('q'+level+'-'+qi);document.querySelectorAll('.options button').forEach(x=>x.disabled=true)}else b.disabled=true}
const S=[['After','I finished my homework,','I practiced the violin.'],['I joined the art club','before','I met my new friend.'],['When','the phone rang,','I answered it.']];let si=0;
function sorter(){chosen=[];shell('Arrange / 句子拼貼','讓事件找到順序',`<p>依中文意思點選紙片，組成句子。點已選紙片可移回。</p><div class="row">${S.map((_,i)=>`<button onclick="si=${i};sorter()" aria-pressed="${si===i}">${i+1}</button>`).join('')}</div><h3>${['我完成作業後，練習小提琴。','我加入美術社後，才認識新朋友。（請用 before）','電話響時，我接起電話。'][si]}</h3><div class="timeline"><p>先理解意思，再觀察連接詞旁的事件。</p></div><div id="pool" class="row"></div><h3>我的句子</h3><div id="assembled" class="row" style="min-height:70px"></div><div class="row"><button class="primary" onclick="checkSort()">檢查拼貼</button><button onclick="sorter()">重新排列</button></div><div id="feedback" class="feedback" role="status">先選開頭的紙片。</div>`);paintSort()}
function paintSort(){let order=[2,0,1];$('pool').innerHTML=order.filter(i=>!chosen.includes(i)).map(i=>`<button onclick="chosen.push(${i});paintSort()">${S[si][i]}</button>`).join('');$('assembled').innerHTML=chosen.map((i,k)=>`<button onclick="chosen.splice(${k},1);paintSort()">${S[si][i]}</button>`).join('')}
function checkSort(){let ok=chosen.join(',')==='0,1,2';$('feedback').textContent=ok?'拼貼完成！讀出這個句子，再說說哪件事先發生。':'還可以調整。先看句首大寫，再找連接詞與逗號。';if(ok){award('s'+si);speak(S[si].join(' '))}}
const story='MAKE A LITTLE WORLD\nJoin our Story Game Club. We meet in Room 205 on Thursdays at 4:10. You do not need coding skills. Before we use the computers, we draw characters on paper. After we make a short game, we invite classmates to try it. Bring a notebook. Sign up with Ms. Lin before Tuesday. We learn together, and every idea is welcome.';
function reading(){shell('Read / 原創社團公告','從公告找到線索',`<div class="grid"><div><div class="sheet">${story}</div><button onclick="speak(story)">▶ 聽公告</button><details><summary>閱讀提示</summary><p>先圈出時間、地點與報名方式。before 和 after 可以幫你整理活動流程。</p></details></div><div><h2>三枚閱讀印章</h2>${[['Where does the club meet?',['Room 205','Room 502'],0,'r0'],['What happens before computer work?',['Drawing characters','Inviting classmates'],0,'r1'],['Who can join?',['Students without coding skills','Only coding experts'],0,'r2']].map((q,i)=>`<div class="card"><p>${q[0]}</p>${q[1].map((x,j)=>`<button onclick="readAnswer(${i},${j},this)">${x}</button>`).join('')}<p id="rf${i}" role="status" class="small"></p></div>`).join('')}</div></div>`)}
function readAnswer(i,j,b){$('rf'+i).textContent=j===0?['正確！地點是 Room 205。','正確！先在紙上畫角色，再使用電腦。','正確！公告明確歡迎沒有程式技能的學生。'][i]:'回到公告找證據，再試一次。';if(j===0){award('r'+i);b.parentElement.querySelectorAll('button').forEach(x=>x.disabled=true)}}
function studio(){shell('Create / 留下你的想法','設計一張社團邀請卡',`<p>寫給想認識新社團的同學。可用虛構社團；先把想法說清楚，再慢慢修整英文。</p><div class="grid"><div><label for="student">班級／座號或暱稱</label><input id="student" maxlength="40" placeholder="例如：802-12"><label for="club">社團名稱（英文）</label><input id="club" maxlength="80" placeholder="例如：Story Art Club"><label for="draft">英文邀請內容</label><textarea id="draft" maxlength="3000" placeholder="We meet…\nBefore we…, we…\nAfter we…, we…\nBring…"></textarea><div class="row"><button onclick="checkDraft()">查看寫作提醒</button><button onclick="speak($('draft').value)">▶ 聽我的作品</button></div><div id="writingFeedback" class="feedback" role="status">小目標：地點或時間、社團活動、至少一個時間連接詞。</div><label for="reflection">想問老師／學習反思（選填）</label><textarea id="reflection" maxlength="1000" style="min-height:85px" placeholder="哪個用法還想練習？"></textarea></div><div><div class="kicker">My invitation</div><div id="preview" class="sheet"></div><p class="muted">草稿與進度只保存在此瀏覽器。送出後作品會交給老師。</p><label for="file">附加作品（選填，4 MB 以下）</label><input type="file" id="file" accept="image/png,image/jpeg,image/webp,application/pdf,audio/mpeg,audio/wav,audio/webm,audio/mp4,audio/ogg"><p id="fileStatus" class="small" role="status"></p><div class="row"><button onclick="downloadWork()">下載文字備份</button><button class="primary" onclick="submitWork()">送交老師 ↗</button></div><p id="uploadStatus" role="status" class="small">${GAS_URL?'送出後請查看新分頁的收件結果。':'老師尚未連接收件服務；目前可先下載作品。'}</p></div></div>`);['student','club','draft','reflection'].forEach(k=>{$(k).value=state.draft[k]||'';$(k).oninput=()=>{state.draft[k]=$(k).value;save();preview()}});attachment=null;$('file').onchange=loadFile;preview()}
function preview(){$('preview').textContent=($('club').value||'Your club, your idea.')+'\n\n'+($('draft').value||'你的英文邀請卡會出現在這裡。')}
function checkDraft(){let t=$('draft').value;let tests=[[/\b(before|after|when)\b/i.test(t),'時間連接詞'],[/\b(room|at|on|in|monday|tuesday|wednesday|thursday|friday)\b/i.test(t),'時間／地點線索'],[t.trim().split(/\s+/).filter(Boolean).length>=25,'至少 25 個英文單字']];$('writingFeedback').textContent=tests.map(x=>(x[0]?'✓ ':'○ ')+x[1]).join(' · ')+'。這是關鍵字提醒，並非文法評分；請確認每句意思與事件順序。'}
function work(){return {lesson:'English Unit 2',student:$('student').value.trim(),club:$('club').value.trim(),text:$('draft').value.trim(),reflection:$('reflection').value.trim(),petals:state.done.length,attachment}}
function downloadWork(){let w=work();let blob=new Blob([w.lesson+'\n'+w.student+'\n'+w.club+'\n\n'+w.text+'\n\n反思：'+w.reflection],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='English-L2-my-work.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function loadFile(){attachment=null;let f=$('file').files[0];if(!f){$('fileStatus').textContent='';return}if(f.size>4*1024*1024){$('fileStatus').textContent='檔案超過 4 MB，請縮小或改用文字作品。';$('file').value='';return}let allowed=['image/png','image/jpeg','image/webp','application/pdf','audio/mpeg','audio/wav','audio/webm','audio/mp4','audio/ogg'];if(!allowed.includes(f.type)){$('fileStatus').textContent='請選擇 PNG、JPG、WebP、PDF 或支援的音檔。';$('file').value='';return}readingFile=true;let r=new FileReader();r.onload=()=>{attachment={name:f.name,type:f.type,data:String(r.result).split(',')[1]};readingFile=false;$('fileStatus').textContent='附件已備妥：'+f.name};r.onerror=()=>{readingFile=false;$('fileStatus').textContent='無法讀取，請重新選擇檔案。'};r.readAsDataURL(f)}
function submitWork(){let s=$('uploadStatus');if(!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(GAS_URL)){s.textContent='尚未連接收件服務，請先下載備份。';return}if(readingFile){s.textContent='附件正在讀取，請稍候。';return}let w=work();if(!w.student||!w.club||!w.text){s.textContent='請填寫班級座號或暱稱、社團名稱與英文內容。';return}let f=document.createElement('form');f.method='POST';f.action=GAS_URL;f.target='_blank';let input=document.createElement('input');input.type='hidden';input.name='payload';input.value=JSON.stringify(w);f.appendChild(input);document.body.appendChild(f);f.submit();f.remove();s.textContent='已開啟收件結果分頁；只有看到「收件成功」才表示存檔完成。若未開啟，請允許新分頁，並先下載備份。'}
go(0);
</script><nav class="english-bridge english-steps" aria-label="頁尾章節導覽"><a href="E1.html">← 上一章 E1</a><a class="home-link" href="index.html">⌂ 回首頁</a><a href="E3.html">下一章 E3 →</a></nav><script>(()=>{const l=new URLSearchParams(location.search).get('level');if(['0','1','2'].includes(l)){go(1);level=Number(l);qi=0;quiz();}})();</script></body></html>
